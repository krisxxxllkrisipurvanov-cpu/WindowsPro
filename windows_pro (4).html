<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows PRO</title>
    <style>
        :root {
            --taskbar-height: 48px;
            --window-title-height: 36px;
            --accent: #0078d4;
            --accent-light: #60cdff;
            --taskbar-bg: #12121f;
            --close-hover: #e81123;
            --start-hover: #252535;
            --shadow: 0 10px 40px rgba(0,0,0,0.4);
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.18);
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden; background: #000; cursor: default;
        }

        /* ── DESKTOP ─────────────────────────────────── */
        #desktop {
            position: absolute; inset: 0;
            bottom: var(--taskbar-height);
            background: #07030f;
            overflow: hidden; z-index: 1;
        }
        #desktop canvas {
            position:absolute; inset:0; width:100%; height:100%;
        }

        /* ── DESKTOP ICONS ───────────────────────────── */
        #desktop-icons {
            position: absolute; top:16px; left:16px; right:16px;
            bottom: calc(var(--taskbar-height) + 16px);
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, minmax(96px, 1fr));
            grid-auto-columns: 92px;
            gap: 4px 2px; z-index:2;
            align-content: start; justify-content: start;
            overflow: hidden;
        }
        .desktop-icon {
            display: flex; flex-direction: column; align-items: center;
            width: 80px; padding: 10px 6px; border-radius: 8px;
            cursor: pointer; color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,.6);
            transition: background .15s, transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
            animation: iconIn .4s cubic-bezier(.34,1.56,.64,1) both;
        }
        @keyframes iconIn {
            from { opacity:0; transform:translateY(16px) scale(.85); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }
        .desktop-icon:hover {
            background: rgba(255,255,255,.18);
            backdrop-filter: blur(6px);
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .desktop-icon:active { transform: scale(.94); box-shadow:none; }
        .desktop-icon .icon-img {
            width:42px; height:42px; border-radius:9px;
            display:flex; align-items:center; justify-content:center;
            margin-bottom:5px; flex-shrink:0; color:#fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.35);
            transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
        }
        .desktop-icon:hover .icon-img { transform:scale(1.1); box-shadow:0 6px 18px rgba(0,0,0,.4); }
        .desktop-icon .icon-img svg { width:22px; height:22px; }
        .desktop-icon .icon-label {
            font-size:11px; font-weight:500; line-height:1.2;
            word-wrap:break-word; max-width:76px; text-align:center;
            letter-spacing:.2px; pointer-events:none;
        }
        #installed-icons { display: contents; }

        /* icon colour themes */
        .ic-blue   { background: linear-gradient(145deg,#0078d4,#005a9e); }
        .ic-orange { background: linear-gradient(145deg,#e67e22,#c96500); }
        .ic-teal   { background: linear-gradient(145deg,#00b4d8,#0096b8); }
        .ic-green  { background: linear-gradient(145deg,#27ae60,#1a8f4c); }
        .ic-red    { background: linear-gradient(145deg,#e74c3c,#c0392b); }
        .ic-purple { background: linear-gradient(145deg,#8e44ad,#6c3483); }
        .ic-gray   { background: linear-gradient(145deg,#607080,#455060); }
        .ic-pink   { background: linear-gradient(145deg,#e91e8c,#c21678); }
        .ic-amber  { background: linear-gradient(145deg,#f59e0b,#d97706); }
        .ic-text   { background: linear-gradient(145deg,#0078d4,#005a9e);
                     font-size:12px; font-weight:700; }

        /* ── TASKBAR ─────────────────────────────────── */
        #taskbar {
            position: absolute; bottom:0; left:0; right:0;
            height: var(--taskbar-height);
            background: var(--taskbar-bg);
            display: flex; align-items: center; z-index: 1000;
            box-shadow: 0 -1px 0 rgba(255,255,255,.05);
            padding: 0 4px; gap:2px;
        }
        #start-btn {
            width:42px; height:38px; border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; color:#fff; flex-shrink:0;
            transition: background .15s, transform .1s;
        }
        #start-btn svg { width:20px; height:20px; transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
        #start-btn:hover { background: var(--start-hover); }
        #start-btn:hover svg { transform: scale(1.15); }
        #start-btn:active,#start-btn.active { background:#2d2d48; }

        #taskbar-apps {
            display:flex; align-items:center; gap:2px;
            flex:1; overflow-x:auto; height:100%; padding:4px 2px;
        }
        #taskbar-apps::-webkit-scrollbar { display:none; }
        .taskbar-app {
            display:flex; align-items:center; gap:7px;
            padding:5px 12px; border-radius:8px; cursor:pointer;
            color:#bbb; font-size:12px; font-weight:500;
            white-space:nowrap; height:36px;
            transition: background .12s, color .12s;
            position:relative;
        }
        .taskbar-app:hover { background:rgba(255,255,255,.08); color:#fff; }
        .taskbar-app.active { background:rgba(255,255,255,.12); color:#fff; }
        .taskbar-app.active::after {
            content:''; position:absolute;
            bottom:3px; left:50%; transform:translateX(-50%);
            width:0; height:2px; border-radius:2px;
            background:var(--accent-light);
            animation: tbIndicator .22s .05s ease-out forwards;
        }
        @keyframes tbIndicator { to { width:50%; } }
        .taskbar-app .t-icon {
            width:20px; height:20px; border-radius:4px;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; color:#fff; font-size:10px; font-weight:700;
        }
        .taskbar-app .t-icon svg { width:13px; height:13px; }

        #system-tray {
            display:flex; align-items:center; gap:6px;
            padding:0 14px; color:#ccc; font-size:12px; flex-shrink:0;
        }
        #system-tray .time { font-weight:600; letter-spacing:.3px; }
        #system-tray .date { font-size:10.5px; color:#888; }

        /* ── START MENU ─────────────────────────────── */
        #start-menu {
            position:absolute;
            bottom:calc(var(--taskbar-height) + 8px); left:8px;
            width:360px; max-height:520px;
            background:rgba(18,18,30,.97);
            backdrop-filter:blur(32px);
            border-radius:16px;
            box-shadow:0 24px 64px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.07);
            z-index:999;
            display:flex; flex-direction:column; overflow:hidden;
            pointer-events:none; opacity:0;
            transform: translateY(14px) scale(.96);
            transition: opacity .22s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
        }
        #start-menu.open { pointer-events:all; opacity:1; transform:translateY(0) scale(1); }
        #start-menu .sm-header {
            padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.07);
            display:flex; align-items:center; gap:14px;
            color:#fff; font-weight:600; font-size:14px;
        }
        #start-menu .sm-header .avatar {
            width:40px; height:40px; border-radius:50%;
            background:linear-gradient(135deg,var(--accent),#60cdff);
            display:flex; align-items:center; justify-content:center; color:#fff;
            box-shadow:0 3px 12px rgba(0,120,212,.45);
            flex-shrink:0;
        }
        #start-menu .sm-header .avatar svg { width:20px; height:20px; }
        #start-menu .sm-list { padding:6px 0; flex:1; overflow-y:auto; }
        #start-menu .sm-list::-webkit-scrollbar { width:4px; }
        #start-menu .sm-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:2px; }
        #start-menu .sm-item {
            display:flex; align-items:center; gap:12px;
            padding:10px 20px; cursor:pointer; color:#ccc;
            font-size:13px; transition: background .1s, color .1s;
        }
        #start-menu .sm-item:hover { background:rgba(255,255,255,.07); color:#fff; }
        #start-menu .sm-item .sm-icon {
            width:26px; height:26px; border-radius:5px;
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-weight:700; font-size:10px; flex-shrink:0;
        }
        #start-menu .sm-item .sm-icon svg { width:14px; height:14px; }
        #start-menu .sm-footer {
            padding:12px 20px; border-top:1px solid rgba(255,255,255,.07); display:flex; gap:8px;
        }
        #start-menu .sm-footer button {
            flex:1; padding:9px 10px; border:none; border-radius:10px;
            cursor:pointer; background:rgba(255,255,255,.07); color:#bbb;
            font-size:12px; font-weight:500;
            display:flex; align-items:center; justify-content:center; gap:6px;
            transition: background .15s, color .15s, transform .1s;
        }
        #start-menu .sm-footer button svg { width:14px; height:14px; flex-shrink:0; }
        #start-menu .sm-footer button:hover { background:rgba(255,255,255,.15); color:#fff; transform:translateY(-1px); }
        #start-menu .sm-footer button:active { transform:scale(.97); }

        /* ── WINDOWS ─────────────────────────────────── */
        .window {
            position:absolute; min-width:320px; min-height:220px;
            background:#fff; border-radius:10px;
            box-shadow:var(--shadow); display:flex; flex-direction:column;
            overflow:hidden; z-index:10;
            border:1px solid rgba(0,0,0,.12);
            animation:winOpen .24s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes winOpen {
            from { transform:scale(.87) translateY(8px); opacity:0; }
            to   { transform:scale(1) translateY(0); opacity:1; }
        }
        .window.maximized {
            top:0!important; left:0!important;
            width:100%!important; height:calc(100% - var(--taskbar-height))!important;
            border-radius:0!important; resize:none!important; animation:none;
        }
        .window.minimized { display:none!important; }
        .window.focused {
            z-index:100;
            box-shadow:0 16px 52px rgba(0,0,0,.5), 0 0 0 1px rgba(0,120,212,.18);
        }
        .window-title-bar {
            display:flex; align-items:center;
            height:var(--window-title-height);
            background:#fefefe; padding:0 8px;
            cursor:default; flex-shrink:0;
            border-bottom:1px solid #e8e8e8; gap:8px;
        }
        .window.focused .window-title-bar { background:#fff; border-bottom-color:#ddd; }
        .window-title-icon {
            width:20px; height:20px; border-radius:4px;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; color:#fff;
        }
        .window-title-icon svg { width:11px; height:11px; }
        .window-title-text {
            flex:1; font-size:12.5px; font-weight:500; color:#333;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .window-title-buttons { display:flex; gap:1px; flex-shrink:0; }
        .win-btn {
            width:32px; height:26px; border-radius:6px; border:none;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            background:transparent; color:#666;
            transition: background .1s, color .1s, transform .08s;
        }
        .win-btn svg { width:12px; height:12px; }
        .win-btn:hover { background:#e0e0e0; color:#222; }
        .win-btn:active { transform:scale(.9); }
        .win-btn.close-btn:hover { background:var(--close-hover); color:#fff; }
        .window-content { flex:1; overflow:auto; background:#fafafa; position:relative; }
        .window-resize-handle {
            position:absolute; bottom:0; right:0;
            width:18px; height:18px; cursor:nwse-resize; z-index:5;
        }

        /* ── EXPLORER ─────────────────────────────────── */
        .explorer-toolbar {
            display:flex; align-items:center; gap:6px;
            padding:8px 12px; background:#f5f5f5;
            border-bottom:1px solid #e0e0e0; flex-wrap:wrap;
        }
        .explorer-toolbar button {
            padding:5px 12px; border:1px solid #d0d0d0; border-radius:6px;
            background:#fff; cursor:pointer; font-size:12px;
            display:flex; align-items:center; gap:5px; color:#444;
            transition: background .1s, border-color .1s, color .1s;
        }
        .explorer-toolbar button svg { width:13px; height:13px; }
        .explorer-toolbar button:hover { background:#e8f4ff; border-color:var(--accent); color:var(--accent); }
        .explorer-address {
            flex:1; min-width:120px; padding:5px 10px;
            border:1px solid #d0d0d0; border-radius:6px;
            font-size:12px; background:#fff; color:#333;
            font-family:'Consolas','Courier New',monospace;
        }
        .explorer-items {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
            gap:10px; padding:16px;
        }
        .explorer-item {
            display:flex; flex-direction:column; align-items:center;
            padding:12px 8px; border-radius:8px; cursor:pointer;
            border:2px solid transparent; text-align:center;
            transition: background .12s, border-color .12s, transform .15s cubic-bezier(.34,1.56,.64,1);
        }
        .explorer-item:hover { background:#e8f0f8; border-color:#c0d8f0; transform:translateY(-2px); }
        .explorer-item:active { transform:scale(.95); }
        .explorer-item .e-icon {
            width:46px; height:46px; border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            margin-bottom:6px; color:#fff;
        }
        .explorer-item .e-icon svg { width:26px; height:26px; }
        .e-folder { background:linear-gradient(145deg,#f5a623,#e08c0a); box-shadow:0 2px 8px rgba(240,166,35,.3); }
        .e-file   { background:linear-gradient(145deg,#5b8dee,#3d72d9); box-shadow:0 2px 8px rgba(60,114,217,.25); }
        .e-drive  { background:linear-gradient(145deg,#4caf8a,#388a6e); box-shadow:0 2px 8px rgba(60,170,120,.25); }
        .e-admin  { background:linear-gradient(145deg,#c0392b,#922b21); box-shadow:0 2px 8px rgba(192,57,43,.4); }
        .explorer-item .e-name { font-size:11px; color:#333; word-break:break-word; line-height:1.3; }
        .explorer-item .e-meta { font-size:9px; color:#888; margin-top:2px; }

        /* ── STORE ──────────────────────────────────── */
        .store-header {
            padding:20px; background:linear-gradient(135deg,#0078d4,#00a4ef);
            color:#fff; text-align:center;
        }
        .store-header h2 { font-weight:700; font-size:18px; }
        .store-header p { font-size:12px; margin-top:4px; opacity:.85; }
        .store-apps {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
            gap:14px; padding:18px;
        }
        .store-app-card {
            background:#fff; border-radius:12px; padding:16px; text-align:center;
            box-shadow:0 2px 12px rgba(0,0,0,.1); cursor:pointer;
            border:2px solid transparent;
            transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, border-color .2s;
        }
        .store-app-card:hover {
            transform:translateY(-5px);
            box-shadow:0 10px 28px rgba(0,0,0,.2);
            border-color:var(--accent-light);
        }
        .store-app-card .sa-icon {
            width:50px; height:50px; margin:0 auto 8px;
            display:flex; align-items:center; justify-content:center;
            border-radius:10px; color:#fff; font-weight:700; font-size:15px;
            box-shadow:0 3px 12px rgba(0,0,0,.2);
        }
        .store-app-card .sa-name { font-weight:600; font-size:12.5px; margin-bottom:3px; }
        .store-app-card .sa-dev  { font-size:10.5px; color:#888; margin-bottom:8px; }
        .store-app-card .sa-desc { font-size:10px; color:#999; margin-bottom:10px; min-height:28px; }
        .store-app-card .sa-btn {
            padding:6px 18px; border-radius:20px; border:none;
            cursor:pointer; font-size:11.5px; font-weight:600;
            background:var(--accent); color:#fff;
            transition: background .15s, transform .12s;
            display:inline-flex; align-items:center; gap:5px;
        }
        .store-app-card .sa-btn svg { width:12px; height:12px; }
        .store-app-card .sa-btn:hover { background:#005a9e; transform:scale(1.05); }
        .store-app-card .sa-btn.installed { background:#e0e0e0; color:#666; cursor:default; }

        /* ── INTERNET EXPLORER ──────────────────────── */
        .ie-toolbar {
            display:flex; gap:4px; padding:6px 8px;
            background:#f5f5f5; border-bottom:1px solid #e0e0e0;
            align-items:center; flex-wrap:wrap;
        }
        .ie-toolbar button {
            padding:5px 10px; border:1px solid #d0d0d0; border-radius:5px;
            background:#fff; cursor:pointer; font-size:12px;
            display:flex; align-items:center; gap:4px; color:#444;
            transition: background .1s;
        }
        .ie-toolbar button svg { width:14px; height:14px; }
        .ie-toolbar button:hover { background:#e8f4ff; }
        .ie-address-bar { flex:1; min-width:150px; display:flex; gap:4px; }
        .ie-address-input {
            flex:1; padding:6px 10px; border:1px solid #d0d0d0;
            border-radius:5px; font-size:12px; background:#fff;
            font-family:'Consolas','Courier New',monospace;
        }
        .ie-content {
            padding:20px; background:#fff; font-size:13px; line-height:1.6; color:#333;
        }

        /* ── TOAST ──────────────────────────────────── */
        .toast {
            position:fixed; bottom:70px; right:20px;
            background:rgba(22,22,38,.97);
            backdrop-filter:blur(20px);
            color:#fff; padding:11px 16px 11px 12px;
            border-radius:12px; z-index:2000;
            font-size:12.5px; font-weight:500; letter-spacing:.3px;
            display:flex; align-items:center; gap:10px; max-width:290px;
            box-shadow:0 8px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
            animation: toastIn .3s cubic-bezier(.34,1.56,.64,1);
        }
        .toast .t-icon-wrap {
            width:24px; height:24px; border-radius:50%;
            background:rgba(255,255,255,.12);
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .toast .t-icon-wrap svg { width:13px; height:13px; }
        @keyframes toastIn  { from{transform:translateX(110%) scale(.9);opacity:0} to{transform:none;opacity:1} }
        @keyframes toastOut { from{transform:none;opacity:1} to{transform:translateX(110%) scale(.9);opacity:0} }

        /* ── CONTEXT MENU ───────────────────────────── */
        .context-menu {
            position:absolute; background:#fff;
            border-radius:12px;
            box-shadow:0 12px 40px rgba(0,0,0,.32), 0 0 0 1px rgba(0,0,0,.06);
            z-index:2000; padding:6px 0; min-width:200px; display:none;
            overflow:hidden;
            animation: ctxIn .15s ease-out;
        }
        @keyframes ctxIn { from{opacity:0;transform:scale(.94) translateY(-5px)} to{opacity:1;transform:none} }
        .context-menu .cm-item {
            padding:9px 16px; cursor:pointer; font-size:12.5px; color:#333;
            display:flex; align-items:center; gap:10px;
            transition: background .1s, color .1s;
        }
        .context-menu .cm-item svg { width:14px; height:14px; color:#666; flex-shrink:0; }
        .context-menu .cm-item:hover { background:#e8f4ff; color:#0078d4; }
        .context-menu .cm-item:hover svg { color:#0078d4; }
        .context-menu .cm-separator { height:1px; background:#eee; margin:4px 0; }

        /* ── SCROLLBAR ──────────────────────────────── */
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#c8c8c8; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#a0a0a0; }

        /* ── LOCK / LOGIN SCREEN ────────────────────── */
        .auth-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg,#0a5f7a,#0d7a9a 20%,#0b6b8d 40%,#0a5c75 60%,#09506b 80%,#073b52);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; cursor: default;
            animation: authIn .35s ease;
        }
        .auth-screen::before {
            content:''; position:absolute; inset:0; pointer-events:none;
            background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.07), transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(0,180,220,.12), transparent 50%);
        }
        @keyframes authIn { from { opacity:0; } to { opacity:1; } }
        .auth-time { font-size: 92px; font-weight: 200; letter-spacing: -3px; text-shadow: 0 4px 20px rgba(0,0,0,.4); }
        .auth-date { font-size: 18px; font-weight: 400; opacity: .85; margin-top: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
        .auth-hint { margin-top: 60px; font-size: 13px; opacity: .75; letter-spacing: .5px; }
        .auth-card {
            margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 14px;
            background: rgba(255,255,255,.08); backdrop-filter: blur(20px);
            padding: 28px 36px; border-radius: 18px;
            border: 1px solid rgba(255,255,255,.12); position: relative;
        }
        .auth-avatar {
            width: 88px; height: 88px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #60cdff);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 24px rgba(0,120,212,.5);
        }
        .auth-avatar svg { width: 44px; height: 44px; color: #fff; }
        .auth-name { font-size: 20px; font-weight: 500; }
        .auth-input {
            width: 240px; padding: 9px 14px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,.25);
            background: rgba(255,255,255,.1); color: #fff;
            font-size: 13px; outline: none; text-align: center;
            transition: border-color .15s, background .15s;
        }
        .auth-input::placeholder { color: rgba(255,255,255,.5); }
        .auth-input:focus { border-color: var(--accent-light); background: rgba(255,255,255,.18); }
        .auth-btn {
            padding: 8px 22px; border-radius: 20px; border: none;
            background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: background .15s, transform .1s;
        }
        .auth-btn:hover { background: #005a9e; }
        .auth-btn:active { transform: scale(.96); }

        /* rename input on icon */
        .rename-input {
            font-size: 11px; text-align: center; padding: 2px 4px;
            border: 1px solid var(--accent); border-radius: 3px;
            outline: none; width: 76px; color: #000; background: #fff;
        }
    </style>
</head>

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════
    let windows = [], windowIdCounter = 0, focusedWindowId = null;
    let installedApps = [], windowZIndex = 10;

    // ── MONEY & PERSISTENCE ─────────────────────────────────────
    const SAVE_KEY = 'winpro_save_v1';
    function loadSave() {
        try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e) { return {}; }
    }
    function writeSave(data) {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
    }
    let saveData = loadSave();
    let playerMoney = typeof saveData.money === 'number' ? saveData.money : 0;

    function setMoney(v) {
        playerMoney = Math.max(0, Math.round(v));
        saveData.money = playerMoney;
        writeSave(saveData);
        renderMoneyHUD();
    }
    function addMoney(v) { setMoney(playerMoney + v); }

    function renderMoneyHUD() {
        const el = document.getElementById('money-hud');
        if (el) el.textContent = '$' + playerMoney.toLocaleString();
    }

    function persistOpenApps() {
        saveData.openAppIds = windows.map(w => w.appId).filter(Boolean);
        writeSave(saveData);
    }
    function restoreInstalledApps() {
        const ids = Array.isArray(saveData.installedIds) ? saveData.installedIds : [];
        ids.forEach(id => {
            if (installedApps.some(a => a.id === id)) return;
            const app = storeApps.find(a => a.id === id);
            if (!app) return;
            installedApps.push({
                ...app,
                contentGenerator: (el) => {
                    if (id==='chocolate') {
                        el.innerHTML = `<div style="padding:30px;text-align:center;">
                            <div style="font-size:40px;margin-bottom:12px;">🍫</div>
                            <h2>Шоколадче</h2>
                            <p style="color:#666;margin-top:8px;">Това приложение е спряно от разработчика.</p></div>`;
                    } else if (id==='job') {
                        openJobApp(el);
                    } else {
                        const iconInner = app.iconKey ? I[app.iconKey] : `<span style="font-size:${(app.icon||'').length>2?'16px':'24px'};font-weight:700;">${app.icon||''}</span>`;
                        const ico = `<div style="width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;" class="${app.colorCls}">${iconInner}</div>`;
                        el.innerHTML = `<div style="padding:30px;text-align:center;">${ico}
                            <h2 style="margin-bottom:8px;">${app.name}</h2>
                            <p style="color:#666;">${app.desc}</p>
                            <p style="margin-top:12px;color:#27ae60;font-weight:600;">Running successfully!</p></div>`;
                    }
                }
            });
        });
        updateInstalledIconsDisplay();
        renderSmInstalledApps();
    }
    function restoreLastSession() {
        const ids = Array.isArray(saveData.openAppIds) ? saveData.openAppIds : [];
        ids.forEach(id => {
            const app = installedApps.find(a => a.id === id);
            if (app) openInstalledApp(app);
        });
    }

    // ── APP VERSIONS / UPDATES ──────────────────────────────
    if (!saveData.appVersions) saveData.appVersions = { __global: 1 };
    if (!saveData.installedVersions) saveData.installedVersions = {};
    function getAppVersion(id) {
        return saveData.appVersions[id] || saveData.appVersions.__global || 1;
    }
    function appHasUpdate(id) {
        const inst = saveData.installedVersions[id];
        return inst != null && inst < getAppVersion(id);
    }
    function markInstalledVersion(id) {
        saveData.installedVersions[id] = getAppVersion(id);
        writeSave(saveData);
    }
    function adminPushUpdateAll() {
        saveData.appVersions.__global = (saveData.appVersions.__global || 1) + 1;
        // bump per-app to global so all show update
        storeApps.forEach(a => { saveData.appVersions[a.id] = saveData.appVersions.__global; });
        writeSave(saveData);
        adminUpdateStore();
        const v = document.getElementById('adm-ver'); if (v) v.textContent = 'v' + saveData.appVersions.__global;
        showToast('Update pushed to all apps!', 'refresh');
    }
    function adminPushUpdateOne() {
        const sel = document.getElementById('adm-update-app');
        const id = sel ? sel.value : '';
        if (!id) { showToast('Pick an app first', 'bell'); return; }
        saveData.appVersions[id] = (saveData.appVersions[id] || 1) + 1;
        writeSave(saveData);
        adminUpdateStore();
        const app = storeApps.find(a=>a.id===id);
        showToast('Update pushed: ' + (app?app.name:id), 'refresh');
    }
    function updateInstalledApp(id, btnEl) {
        markInstalledVersion(id);
        adminUpdateStore();
        const app = storeApps.find(a=>a.id===id);
        showToast((app?app.name:id) + ' updated!', 'check');
    }

    // ═══════════════════════════════════════════════════════════
    //  BOOTSTRAP UI
    // ═══════════════════════════════════════════════════════════
    (function bootstrap() {
        // Start button
        document.getElementById('start-btn').innerHTML = I.windows;

        // Avatar
        document.getElementById('sm-avatar').innerHTML = I.user;

        // Desktop icons
        const desktopEl = document.getElementById('desktop');
        const iconsWrap = document.createElement('div');
        iconsWrap.id = 'desktop-icons';
        desktopEl.appendChild(iconsWrap);

        [
            { label:'My PC',             key:'monitor', cls:'ic-blue',   fn:'openMyPC()' },
            { label:'Store',             key:'store',   cls:'ic-orange', fn:'openStore()' },
            { label:'Internet Explorer', key:'globe',   cls:'ic-teal',   fn:'openInternetExplorer()' },
        ].forEach((d,i) => {
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.style.animationDelay = (i * .08 + .04) + 's';
            el.innerHTML = `<div class="icon-img ${d.cls}">${I[d.key]}</div>
                            <div class="icon-label">${d.label}</div>`;
            el.ondblclick = () => { eval(d.fn); };
            el.onclick    = e  => e.stopPropagation();
            iconsWrap.appendChild(el);
        });
        const installedSlot = document.createElement('div');
        installedSlot.id = 'installed-icons';
        iconsWrap.appendChild(installedSlot);

        // Start menu list
        const smList = document.getElementById('sm-list');
        [
            { label:'My PC',             key:'monitor', cls:'ic-blue',   fn:'openMyPC(); closeStartMenu();' },
            { label:'Store',             key:'store',   cls:'ic-orange', fn:'openStore(); closeStartMenu();' },
            { label:'Internet Explorer', key:'globe',   cls:'ic-teal',   fn:'openInternetExplorer(); closeStartMenu();' },
        ].forEach(d => {
            const el = document.createElement('div');
            el.className = 'sm-item';
            el.innerHTML = `<span class="sm-icon ${d.cls}">${I[d.key]}</span>${d.label}`;
            el.onclick = () => eval(d.fn);
            smList.appendChild(el);
        });
        const smInstSlot = document.createElement('div');
        smInstSlot.id = 'sm-installed-apps';
        smList.appendChild(smInstSlot);

        // Start-menu footer buttons
        const lockBtn   = document.getElementById('sm-lock-btn');
        const logoutBtn = document.getElementById('sm-logout-btn');
        lockBtn.innerHTML   = `${I.lock} Lock`;
        logoutBtn.innerHTML = `${I.logout} Logout`;
        lockBtn.onclick   = () => { closeStartMenu(); lockScreen(); };
        logoutBtn.onclick = () => { closeStartMenu(); logoutScreen(); };

        // Context menu
        document.getElementById('context-menu').innerHTML = `
            <div class="cm-item" onclick="refreshDesktop();hideContextMenu();">${I.refresh} Refresh</div>
            <div class="cm-item" onclick="openMyPC();hideContextMenu();">${I.monitor} My PC</div>
            <div class="cm-separator"></div>
            <div class="cm-item" onclick="hideContextMenu();showToast('New Folder created','folder');">${I.folderPlus} New Folder</div>
            <div class="cm-item" onclick="hideContextMenu();showToast('New Text Document','file');">${I.filePlus} New Text Document</div>`;

        // Context-menu trigger on desktop
        desktopEl.addEventListener('contextmenu', e => {
            e.preventDefault();
            const cm = document.getElementById('context-menu');
            cm.style.display = 'block';
            cm.style.animation = 'none';
            void cm.offsetWidth;
            cm.style.animation = '';
            cm.style.left = e.clientX + 'px';
            cm.style.top  = e.clientY + 'px';
            requestAnimationFrame(() => {
                const r = cm.getBoundingClientRect();
                if (r.right  > window.innerWidth)      cm.style.left = (e.clientX - r.width)  + 'px';
                if (r.bottom > window.innerHeight - 56) cm.style.top  = (e.clientY - r.height) + 'px';
            });
        });
        document.addEventListener('click', e => {
            const cm = document.getElementById('context-menu');
            if (!cm.contains(e.target)) hideContextMenu();
            const acm = document.getElementById('app-context-menu');
            if (acm && !acm.contains(e.target)) acm.style.display = 'none';
            const sm  = document.getElementById('start-menu');
            const sb  = document.getElementById('start-btn');
            if (!sm.contains(e.target) && !sb.contains(e.target) && sm.classList.contains('open'))
                closeStartMenu();
        });
    })();

    // ═══════════════════════════════════════════════════════════
    //  START MENU
    // ═══════════════════════════════════════════════════════════
    function toggleStartMenu(e) {
        e.stopPropagation();
        const m = document.getElementById('start-menu');
        const b = document.getElementById('start-btn');
        if (m.classList.contains('open')) { m.classList.remove('open'); b.classList.remove('active'); }
        else { m.classList.add('open'); b.classList.add('active'); renderSmInstalledApps(); }
    }
    function closeStartMenu() {
        document.getElementById('start-menu').classList.remove('open');
        document.getElementById('start-btn').classList.remove('active');
    }
    function renderSmInstalledApps() {
        const c = document.getElementById('sm-installed-apps');
        c.innerHTML = '';
        if (!installedApps.length) {
            c.innerHTML = '<span style="color:#555;font-size:11px;padding:8px 20px;display:block;">No apps installed yet. Visit the Store!</span>';
            return;
        }
        installedApps.forEach(app => {
            const el = document.createElement('div');
            el.className = 'sm-item';
            const inner = app.iconKey ? I[app.iconKey] : `<span style="font-size:11px;font-weight:700;">${app.icon||''}</span>`;
            el.innerHTML = `<span class="sm-icon ${app.colorCls||'ic-blue'}" style="display:flex;align-items:center;justify-content:center;color:#fff;">${inner}</span>${app.name}`;

    // ═══════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════
    const TOAST_ICON = { info:'info', check:'check', lock:'lock', logout:'logout',
                         folder:'folder', file:'file', refresh:'refresh', globe:'globe', bell:'bell', package:'package' };
    function showToast(msg, iconKey = 'info') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = `<div class="t-icon-wrap">${I[TOAST_ICON[iconKey]||'info']}</div><span>${msg}</span>`;

    // ═══════════════════════════════════════════════════════════
    //  HELPERS
    // ═══════════════════════════════════════════════════════════
    function hideContextMenu() { document.getElementById('context-menu').style.display = 'none'; }
    function refreshDesktop()  { showToast('Desktop refreshed', 'refresh'); }

    // ═══════════════════════════════════════════════════════════
    //  WINDOW MANAGEMENT
    // ═══════════════════════════════════════════════════════════
    // iconData: { key, cls } for SVG icon  OR  { text, cls } for text badge
    function createWindow(title, iconData, contentGen, width=600, height=420, left=null, top=null, appId=null) {
        windowIdCounter++;
        const id = 'win-' + windowIdCounter;
        windowZIndex++;
        if (left===null) left = 60 + (windowIdCounter*28) % Math.max(100, window.innerWidth  - width  - 80);
        if (top ===null) top  = 40 + (windowIdCounter*28) % Math.max(60,  window.innerHeight - height - 100);

        const wd = { id, title, iconData, width, height, left, top, maximized:false, minimized:false, zIndex:windowZIndex, appId };
        windows.push(wd);

        const titleIconHTML = buildIconEl(iconData, 'window-title-icon', 11);
        const winEl = document.createElement('div');
        winEl.className = 'window focused'; winEl.id = id;
        winEl.style.cssText = `width:${width}px;height:${height}px;left:${left}px;top:${top}px;z-index:${windowZIndex}`;
        winEl.innerHTML = `
            <div class="window-title-bar" onmousedown="startDrag(event,'${id}')">
                ${titleIconHTML}
                <span class="window-title-text">${title}</span>
                <div class="window-title-buttons">
                    <button class="win-btn min-btn"  onclick="minimizeWindow('${id}')" title="Minimize">${I.minimize}</button>
                    <button class="win-btn max-btn"  onclick="maximizeWindow('${id}')" title="Maximize">${I.maximize}</button>
                    <button class="win-btn close-btn" onclick="closeWindow('${id}')"  title="Close">${I.close}</button>
                </div>
            </div>
            <div class="window-content" id="content-${id}"></div>`;
        document.getElementById('windows-container').appendChild(winEl);

        const contentEl = document.getElementById('content-' + id);
        if (typeof contentGen === 'function') contentGen(contentEl, wd);

        const rh = document.createElement('div');
        rh.className = 'window-resize-handle';
        rh.addEventListener('mousedown', e => startResize(e, id));
        winEl.appendChild(rh);

        winEl.addEventListener('mousedown', e => { focusWindow(id); e.stopPropagation(); });
        focusWindow(id); updateTaskbar(); updateInstalledIconsDisplay();
        return id;
    }

    function buildIconEl(iconData, extraClass, svgSize=14) {
        const cls = (iconData && iconData.cls) ? iconData.cls : 'ic-blue';
        if (iconData && iconData.key) {
            return `<span class="${extraClass} ${cls}">${I[iconData.key]||''}</span>`;
        }
        const text = (iconData && iconData.text) ? iconData.text : (iconData||'');
        return `<span class="${extraClass} ic-text" style="font-size:${Math.max(8, 10 - text.length)}px;font-weight:700;">${text}</span>`;
    }

    function focusWindow(id) {
        focusedWindowId = id; windowZIndex++;
        const el = document.getElementById(id);
        if (el) {
            el.style.zIndex = windowZIndex;
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            el.classList.add('focused');
            const wd = windows.find(w => w.id===id); if (wd) wd.zIndex = windowZIndex;
        }
        updateTaskbar();
    }
    function minimizeWindow(id) {
        const el = document.getElementById(id), wd = windows.find(w=>w.id===id);
        if (!el||!wd) return;
        wd.minimized = true; el.classList.add('minimized');
        const vis = windows.filter(w=>!w.minimized&&w.id!==id);
        focusedWindowId = vis.length ? vis[vis.length-1].id : null;
        updateTaskbar();
    }
    function restoreWindow(id) {
        const el = document.getElementById(id), wd = windows.find(w=>w.id===id);
        if (!el||!wd) return;
        wd.minimized = false; el.classList.remove('minimized');
        if (wd.maximized) el.classList.add('maximized');
        focusWindow(id); updateTaskbar();
    }
    function maximizeWindow(id) {
        const el = document.getElementById(id), wd = windows.find(w=>w.id===id);
        if (!el||!wd) return;
        const btn = el.querySelector('.max-btn');
        if (wd.maximized) {
            wd.maximized = false; el.classList.remove('maximized');
            el.style.width=wd.width+'px'; el.style.height=wd.height+'px';
            el.style.left=wd.left+'px';   el.style.top=wd.top+'px';
            btn.innerHTML = I.maximize; btn.title = 'Maximize';
        } else {
            wd.width=parseInt(el.style.width)||wd.width;
            wd.height=parseInt(el.style.height)||wd.height;
            wd.left=parseInt(el.style.left)||wd.left;
            wd.top=parseInt(el.style.top)||wd.top;
            wd.maximized = true; el.classList.add('maximized');
            btn.innerHTML = I.restore; btn.title = 'Restore';
        }
        focusWindow(id);
    }
    function closeWindow(id) {
        const el = document.getElementById(id); if (!el) return;
        el.style.transition = 'all .14s ease';
        el.style.transform  = 'scale(.88) translateY(6px)';
        el.style.opacity    = '0';
        setTimeout(() => {
            el.remove();
            windows = windows.filter(w=>w.id!==id);
            if (focusedWindowId===id) {
                const vis = windows.filter(w=>!w.minimized);
                focusedWindowId = vis.length ? vis[vis.length-1].id : null;
            }
            updateTaskbar();
            persistOpenApps();
        }, 140);
    }

    // ═══════════════════════════════════════════════════════════
    //  DRAG & RESIZE
    // ═══════════════════════════════════════════════════════════
    let dragData=null;
    function startDrag(e, id) {
        if (e.target.closest('.window-title-buttons')) return;
        const el=document.getElementById(id), wd=windows.find(w=>w.id===id);
        if (!el||!wd||wd.maximized) return;
        focusWindow(id);
        dragData = { id, sx:e.clientX, sy:e.clientY, ol:parseInt(el.style.left)||wd.left, ot:parseInt(el.style.top)||wd.top };
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        e.preventDefault();
    }
    function onDrag(e) {
        if (!dragData) return;
        const el=document.getElementById(dragData.id); if (!el) return;
        const nl=Math.max(-100, Math.min(window.innerWidth-100,  dragData.ol+(e.clientX-dragData.sx)));
        const nt=Math.max(0,    Math.min(window.innerHeight-60,  dragData.ot+(e.clientY-dragData.sy)));
        el.style.left=nl+'px'; el.style.top=nt+'px';
        const wd=windows.find(w=>w.id===dragData.id); if(wd){wd.left=nl;wd.top=nt;}
    }
    function stopDrag() { dragData=null; document.removeEventListener('mousemove',onDrag); document.removeEventListener('mouseup',stopDrag); }

    let resizeData=null;
    function startResize(e, id) {
        e.stopPropagation(); e.preventDefault();
        const el=document.getElementById(id), wd=windows.find(w=>w.id===id);
        if (!el||!wd||wd.maximized) return;
        focusWindow(id);
        resizeData = { id, sx:e.clientX, sy:e.clientY, ow:parseInt(el.style.width)||wd.width, oh:parseInt(el.style.height)||wd.height };
        document.addEventListener('mousemove', onResize);
        document.addEventListener('mouseup', stopResize);
    }
    function onResize(e) {
        if (!resizeData) return;
        const el=document.getElementById(resizeData.id); if (!el) return;
        const nw=Math.max(320, resizeData.ow+(e.clientX-resizeData.sx));
        const nh=Math.max(220, resizeData.oh+(e.clientY-resizeData.sy));
        el.style.width=nw+'px'; el.style.height=nh+'px';
        const wd=windows.find(w=>w.id===resizeData.id); if(wd){wd.width=nw;wd.height=nh;}
    }
    function stopResize() { resizeData=null; document.removeEventListener('mousemove',onResize); document.removeEventListener('mouseup',stopResize); }

    // ═══════════════════════════════════════════════════════════
    //  TASKBAR
    // ═══════════════════════════════════════════════════════════
    function updateTaskbar() {
        const bar = document.getElementById('taskbar-apps');
        bar.innerHTML = '';
        windows.forEach(w => {
            const el = document.createElement('div');
            el.className = 'taskbar-app' + (w.id===focusedWindowId&&!w.minimized ? ' active' : '');
            const tIcon = buildIconEl(w.iconData, 't-icon', 13);
            el.innerHTML = `${tIcon}<span>${w.title}</span>`;
            el.onclick = e => {
                e.stopPropagation();
                if      (w.minimized)           restoreWindow(w.id);
                else if (w.id===focusedWindowId) minimizeWindow(w.id);
                else                            focusWindow(w.id);
            };
            bar.appendChild(el);
        });
    }

    // ═══════════════════════════════════════════════════════════
    //  INSTALLED APPS (desktop icons)
    // ═══════════════════════════════════════════════════════════
    function updateInstalledIconsDisplay() {
        const c = document.getElementById('installed-icons');
        c.innerHTML = '';
        installedApps.forEach((app, i) => {
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.style.animationDelay = (i*.06+.05)+'s';
            el.innerHTML = renderAppIconInner(app);
            el.ondblclick = () => openInstalledApp(app);
            el.onclick = e => e.stopPropagation();
            el.addEventListener('contextmenu', e => {
                e.preventDefault();
                e.stopPropagation();
                showAppContextMenu(e.clientX, e.clientY, app, el);
            });
            c.appendChild(el);
        });
    }

    function renderAppIconInner(app) {
        const inner = app.iconKey
            ? I[app.iconKey]
            : `<span style="font-size:${(app.icon||'').length>2?'10px':'14px'};font-weight:700;">${app.icon||''}</span>`;
        return `<div class="icon-img ${app.colorCls||'ic-blue'}" style="display:flex;align-items:center;justify-content:center;color:#fff;">${inner}</div>
                <div class="icon-label">${app.name}</div>`;
    }

    function showAppContextMenu(x, y, app, iconEl) {
        const cm = document.getElementById('app-context-menu');
        cm.innerHTML = `
            <div class="cm-item" data-act="open">${I.monitor} Open</div>
            <div class="cm-item" data-act="rename">${I.filePlus} Rename</div>
            <div class="cm-separator"></div>
            <div class="cm-item" data-act="delete" style="color:#c0392b;">${I.close} Uninstall</div>`;
        cm.style.display = 'block';
        cm.style.left = x + 'px';
        cm.style.top  = y + 'px';
        requestAnimationFrame(() => {
            const r = cm.getBoundingClientRect();
            if (r.right  > window.innerWidth)       cm.style.left = (x - r.width)  + 'px';
            if (r.bottom > window.innerHeight - 56) cm.style.top  = (y - r.height) + 'px';
        });
        cm.querySelectorAll('.cm-item').forEach(it => {
            it.onclick = (ev) => {
                ev.stopPropagation();
                const act = it.getAttribute('data-act');
                cm.style.display = 'none';
                if (act === 'open')   openInstalledApp(app);
                if (act === 'delete') uninstallApp(app);
                if (act === 'rename') beginRenameApp(app, iconEl);
            };
        });
    }

    function beginRenameApp(app, iconEl) {
        const labelEl = iconEl.querySelector('.icon-label');
        if (!labelEl) return;
        const oldName = app.name;
        const input = document.createElement('input');
        input.className = 'rename-input';
        input.value = oldName;
        labelEl.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const commit = () => {
            if (done) return; done = true;
            const v = input.value.trim() || oldName;
            app.name = v;
            updateInstalledIconsDisplay();
            renderSmInstalledApps();
            windows.forEach(w => {
                if (w.title === oldName) {
                    w.title = v;
                    const titleEl = document.querySelector(`#${w.id} .window-title-text`);
                    if (titleEl) titleEl.textContent = v;
                }
            });
            updateTaskbar();
            showToast('Renamed to ' + v, 'check');
        };
        input.addEventListener('keydown', e => {
            e.stopPropagation();
            if (e.key === 'Enter') input.blur();
            if (e.key === 'Escape') { input.value = oldName; input.blur(); }
        });
        input.addEventListener('blur', commit);
        input.addEventListener('click', e => e.stopPropagation());
    }

    function uninstallApp(app) {
        installedApps = installedApps.filter(a => a !== app);
        windows.filter(w => w.title === app.name).forEach(w => closeWindow(w.id));
        updateInstalledIconsDisplay();
        renderSmInstalledApps();
        showToast(app.name + ' uninstalled', 'check');
    }

    function openInstalledApp(app) {
        if (appHasUpdate(app.id)) {
            showToast(app.name + ' requires an update! Open the Store.', 'bell');
            openStore();
            return;
        }
        const iconData = app.iconKey
            ? { key: app.iconKey, cls: app.colorCls||'ic-blue' }
            : { text: app.icon, cls: app.colorCls||'ic-blue' };
        createWindow(app.name, iconData, app.contentGenerator, 500, 380, null, null, app.id);
        persistOpenApps();
    }

    // ═══════════════════════════════════════════════════════════
    //  FILE SYSTEM
    // ═══════════════════════════════════════════════════════════
    const fileSystem = {
        'This PC': { type:'folder', children: {
            'Local Disk (C:)': { type:'drive', free:'256 GB', total:'512 GB', children: {
                'ADMIN BUTTON': { type:'admin', size:'— SYSTEM —' }
            }},
            'Documents':       { type:'folder', children: {
                'Report.docx':       { type:'file', size:'45 KB' },
                'Budget.xlsx':       { type:'file', size:'120 KB' },
                'Presentation.pptx': { type:'file', size:'2.3 MB' }
            }},
            'Downloads': { type:'folder', children: {
                'installer.exe': { type:'file', size:'5.6 MB' },
                'readme.txt':    { type:'file', size:'2 KB' }
            }},
            'Pictures': { type:'folder', children: {
                'photo1.jpg': { type:'file', size:'1.2 MB' },
                'photo2.png': { type:'file', size:'890 KB' }
            }},
            'Music':   { type:'folder', children: { 'song.mp3': { type:'file', size:'4.1 MB' } }},
            'Videos':  { type:'folder', children: {} },
            'Desktop': { type:'folder', children: {} }
        }}
    };

    function getFolderContents(path) {
        let cur = fileSystem['This PC'];
        for (let i=1;i<path.length;i++) {
            const next = cur?.children?.[path[i]];
            if (next) cur = next; else return null;
        }
        return cur?.children ?? null;
    }

    // ═══════════════════════════════════════════════════════════
    //  MY PC
    // ═══════════════════════════════════════════════════════════
    function renderMyPC(winId) {
        const wd = windows.find(w=>w.id===winId); if (!wd) return;
        if (!wd.filePath) wd.filePath=['This PC'];
        const el = document.getElementById('content-'+winId); if (!el) return;
        const items = getFolderContents(wd.filePath);
        let html = `
            <div class="explorer-toolbar">
                <button onclick="navigateUp('${winId}')">${I.arrowUp} Up</button>
                <input class="explorer-address" value="${wd.filePath.join(' › ')}" readonly>
            </div>
            <div class="explorer-items">`;
        if (items) {
            for (const [name, obj] of Object.entries(items)) {
                let ico, cls, meta='', click;
                if (obj.type==='admin') {
                    ico = I.shield; cls = 'e-admin';
                    meta = obj.size;
                    click = `openAdminPanel()`;
                } else if (obj.type==='drive') {
                    ico = I.drive; cls = 'e-drive'; meta = `${obj.free} free of ${obj.total}`;
                    click = `navigateTo('${winId}','${name.replace(/'/g,"\\'")}')`;
                } else if (obj.type==='folder') {
                    ico = I.folder; cls = 'e-folder'; meta = 'Folder';
                    click = `navigateTo('${winId}','${name.replace(/'/g,"\\'")}')`;
                } else {
                    ico = I.file; cls = 'e-file'; meta = obj.size;
                    click = `showToast('Opened: ${name}','file')`;
                }
                html += `<div class="explorer-item" onclick="${click}">
                            <div class="e-icon ${cls}">${ico}</div>
                            <div class="e-name">${name}</div>
                            <div class="e-meta">${meta}</div>
                         </div>`;
            }
        } else {
            html += '<p style="padding:20px;color:#999;font-size:12px;">This folder is empty.</p>';
        }
        html += '</div>';
        el.innerHTML = html;
    }

    function navigateTo(winId, name) {
        const wd=windows.find(w=>w.id===winId);
        if(wd&&wd.filePath){wd.filePath.push(name);renderMyPC(winId);}
    }
    function navigateUp(winId) {
        const wd=windows.find(w=>w.id===winId);
        if(wd&&wd.filePath&&wd.filePath.length>1){wd.filePath.pop();renderMyPC(winId);}
    }

    function openMyPC() {
        const id = createWindow('My PC', {key:'monitor',cls:'ic-blue'}, (el,wd) => {
            wd.filePath=['This PC']; renderMyPC(wd.id);
        }, 650, 460);
    }

    // ═══════════════════════════════════════════════════════════
    //  INTERNET EXPLORER
    // ═══════════════════════════════════════════════════════════
    function openInternetExplorer() {
        createWindow('Internet Explorer', {key:'globe',cls:'ic-teal'}, (el, wd) => {
            el.innerHTML = `
                <div class="ie-toolbar">
                    <button onclick="document.getElementById('ie-a-${wd.id}').focus()">${I.home} Home</button>
                    <div class="ie-address-bar">
                        <input class="ie-address-input" id="ie-a-${wd.id}" value="https://www.bing.com"
                               onkeydown="if(event.key==='Enter')navigateIE('${wd.id}',this.value)">
                        <button onclick="navigateIE('${wd.id}',document.getElementById('ie-a-${wd.id}').value)">Go</button>
                    </div>
                </div>
                <div class="ie-content">
                    <h2 style="margin-bottom:10px;">Internet Explorer</h2>
                    <p>Type a full web address (starting with <code>https://</code>) and press <strong>Go</strong>.</p>
                    <p style="margin-top:8px;">Example: <code>https://www.wikipedia.org</code></p>
                </div>`;
        }, 750, 520);
    }

    function navigateIE(winId, url) {
        if (!url) return;

    function installApp(id, btnEl) {

        if (installedApps.some(a=>a.id===id)) { showToast(app.name+' is already installed!','bell'); return; }

        if (price > 0 && playerMoney < price) {

            ...app,

                    el.innerHTML = `<div style="padding:30px;text-align:center;">

                    const iconInner = app.iconKey ? I[app.iconKey] : `<span style="font-size:${(app.icon||'').length>2?'16px':'24px'};font-weight:700;">${app.icon||''}</span>`;
                    const ico = `<div style="width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;" class="${app.colorCls}">${iconInner}</div>`;

                        <p style="color:#666;">${app.desc}</p>
                        <p style="margin-top:12px;color:#27ae60;font-weight:600;">Running successfully!</p></div>`;
                }
            }
        });
        if (btnEl) {
            btnEl.innerHTML = `${I.check} Инсталирано`;
            btnEl.classList.add('installed');
            btnEl.disabled = false;
            btnEl.onclick = () => showToast(app.name+' is already installed!','bell');

    let authClockInterval = null;
    function buildAuthScreen(mode) {
        const root = document.getElementById('auth-root');
        root.innerHTML = '';
        const scr = document.createElement('div');
        scr.className = 'auth-screen';
        const isLock = mode === 'lock';
        scr.innerHTML = `
            <div class="auth-time" id="auth-time"></div>
            <div class="auth-date" id="auth-date"></div>
            <div class="auth-card">
                <div class="auth-avatar">${I.user}</div>
                <div class="auth-name">User</div>
                <input type="password" class="auth-input" id="auth-input"
                       placeholder="${isLock ? 'Enter password to unlock' : 'Sign in to Windows PRO'}" />
                <button class="auth-btn" id="auth-btn">${isLock ? 'Unlock' : 'Sign in'}</button>
            </div>
            <div class="auth-hint">${isLock ? 'Press Enter or click Unlock (any password works)' : 'Press Enter or click Sign in (any password works)'}</div>`;
        root.appendChild(scr);

        const tEl = scr.querySelector('#auth-time');
        const dEl = scr.querySelector('#auth-date');
        const tick = () => {
            const n = new Date();
            tEl.textContent = n.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
            dEl.textContent = n.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
        };
        tick();
        if (authClockInterval) clearInterval(authClockInterval);
        authClockInterval = setInterval(tick, 1000);

        const inp = scr.querySelector('#auth-input');
        const btn = scr.querySelector('#auth-btn');
        const submit = () => {
            clearInterval(authClockInterval); authClockInterval = null;
            scr.style.transition = 'opacity .25s ease';
            scr.style.opacity = '0';
            setTimeout(() => { root.innerHTML = ''; showToast(isLock ? 'Welcome back!' : 'Signed in', 'check'); }, 250);
        };
        btn.onclick = submit;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        setTimeout(() => inp.focus(), 50);
    }
    function lockScreen()   { buildAuthScreen('lock'); }
    function logoutScreen() {
        // close all windows on logout
        windows.slice().forEach(w => { const el = document.getElementById(w.id); if (el) el.remove(); });
        windows = []; focusedWindowId = null; updateTaskbar();
        buildAuthScreen('login');
    }

    // ═══════════════════════════════════════════════════════════
    // WARM COSMIC WALLPAPER
    (function(){
        const bgC = document.getElementById('wp-bg');
        const fgC = document.getElementById('wp-fg');
        const bgX = bgC.getContext('2d');
        const fgX = fgC.getContext('2d');
        const desktop = document.getElementById('desktop');
        let W, H, dpr;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            W = desktop.clientWidth;
            H = desktop.clientHeight;
            for (const c of [bgC, fgC]) {
                c.width = W * dpr; c.height = H * dpr;
                c.style.width = W + 'px'; c.style.height = H + 'px';
            }
            bgX.setTransform(dpr,0,0,dpr,0,0);
            fgX.setTransform(dpr,0,0,dpr,0,0);
            buildBg();
        }

        function buildBg() {
            const g = bgX.createRadialGradient(W*.42,H*.45,0,W*.5,H*.5,W*.85);
            g.addColorStop(0,'#1e0e02'); g.addColorStop(.3,'#130900');
            g.addColorStop(.7,'#0a0401'); g.addColorStop(1,'#040100');
            bgX.fillStyle=g; bgX.fillRect(0,0,W,H);
            [{cx:.22,cy:.28,rx:.30,ry:.22,r:120,g:55,b:10,a:.13},
             {cx:.70,cy:.60,rx:.35,ry:.22,r:200,g:95,b:20,a:.10},
             {cx:.50,cy:.82,rx:.40,ry:.18,r:160,g:70,b:15,a:.09},
             {cx:.88,cy:.30,rx:.22,ry:.18,r:190,g:80,b:25,a:.08},
             {cx:.10,cy:.70,rx:.25,ry:.16,r:140,g:60,b:10,a:.09}
            ].forEach(n=>{
                bgX.save(); bgX.translate(n.cx*W,n.cy*H); bgX.scale(1,n.ry/n.rx);
                const rad=n.rx*W, grd=bgX.createRadialGradient(0,0,0,0,0,rad);
                grd.addColorStop(0,`rgba(${n.r},${n.g},${n.b},${n.a*1.8})`);
                grd.addColorStop(.4,`rgba(${n.r},${n.g},${n.b},${n.a})`);
                grd.addColorStop(1,`rgba(${n.r},${n.g},${n.b},0)`);
                bgX.beginPath(); bgX.arc(0,0,rad,0,Math.PI*2);
                bgX.fillStyle=grd; bgX.fill(); bgX.restore();
            });
        }

        let stars=[], dust=[], shoots=[];
        function initStars(){
            stars=Array.from({length:380},()=>{
                const w=Math.random();
                return {x:Math.random()*W,y:Math.random()*H,
                    r:Math.pow(Math.random(),2.5)*2.2+.25,
                    speed:.3+Math.random()*1.1,phase:Math.random()*Math.PI*2,
                    hue:w>.7?38:w>.3?22:210,sat:w>.3?80:20};
            });
        }
        function initDust(){
            dust=Array.from({length:50},()=>({
                x:Math.random()*W,y:Math.random()*H,
                vx:(Math.random()-.5)*.06,vy:(Math.random()-.5)*.04,
                r:Math.random()*3+1,alpha:.04+Math.random()*.14,
                hue:25+Math.random()*35
            }));
        }

        let last=0;
        function frame(ts){
            const dt=Math.min(ts-last,50); last=ts;
            const ctx=fgX;
            ctx.clearRect(0,0,W,H);
            // galaxy arms
            ctx.save(); ctx.translate(W*.5,H*.5); ctx.rotate(ts*.000018);
            for(let arm=0;arm<2;arm++){
                for(let i=0;i<70;i++){
                    const f=i/70,dist=f*Math.min(W,H)*.36;
                    const th=f*2.8+arm*Math.PI;
                    const a=(1-f)*.038*(1+.3*Math.sin(ts*.0005+f*10));
                    ctx.beginPath(); ctx.arc(Math.cos(th)*dist,Math.sin(th)*dist*.52,((1-f)*3+.5),0,Math.PI*2);
                    ctx.fillStyle=`rgba(240,155,55,${a})`; ctx.fill();
                }
            }
            const cg=ctx.createRadialGradient(0,0,0,0,0,28);
            cg.addColorStop(0,'rgba(255,210,130,0.18)'); cg.addColorStop(1,'rgba(255,160,60,0)');
            ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
            ctx.restore();
            // stars
            stars.forEach(s=>{
                const tw=.5+.5*Math.sin(ts*s.speed*.001+s.phase);
                const alpha=.35+tw*.65, r=s.r*(.88+tw*.12);
                ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2);
                ctx.fillStyle=`hsla(${s.hue},${s.sat}%,${82+tw*18}%,${alpha})`; ctx.fill();
                if(r>1.4&&tw>.75){
                    ctx.beginPath(); ctx.arc(s.x,s.y,r*2.2,0,Math.PI*2);
                    ctx.fillStyle=`hsla(${s.hue},70%,80%,${(tw-.75)*.12})`; ctx.fill();
                }
            });
            // dust
            dust.forEach(p=>{
                p.x+=p.vx*dt*.06; p.y+=p.vy*dt*.06;
                if(p.x<-5)p.x=W+5; if(p.x>W+5)p.x=-5;
                if(p.y<-5)p.y=H+5; if(p.y>H+5)p.y=-5;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle=`hsla(${p.hue},70%,65%,${p.alpha})`; ctx.fill();
            });
            // shooting stars
            if(shoots.length<3&&Math.random()<.003){
                const ang=-.2-Math.random()*.3,spd=2.5+Math.random()*2;
                shoots.push({x:Math.random()*W*.9,y:Math.random()*H*.4,
                    vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
                    life:1,decay:.015+Math.random()*.01,len:80+Math.random()*100});
            }
            for(let i=shoots.length-1;i>=0;i--){
                const s=shoots[i];
                s.x+=s.vx*dt*.06; s.y+=s.vy*dt*.06; s.life-=s.decay*dt*.06;
                if(s.life<=0){shoots.splice(i,1);continue;}
                const mag=Math.hypot(s.vx,s.vy);
                const tx=s.x-s.vx/mag*s.len*s.life, ty=s.y-s.vy/mag*s.len*s.life;
                const g=ctx.createLinearGradient(tx,ty,s.x,s.y);
                g.addColorStop(0,'rgba(255,200,120,0)');
                g.addColorStop(.6,`rgba(255,220,160,${s.life*.6})`);
                g.addColorStop(1,`rgba(255,240,200,${s.life*.95})`);
                ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(s.x,s.y);
                ctx.strokeStyle=g; ctx.lineWidth=1.4*s.life; ctx.lineCap='round'; ctx.stroke();
                ctx.beginPath(); ctx.arc(s.x,s.y,1.8*s.life,0,Math.PI*2);
                ctx.fillStyle=`rgba(255,240,210,${s.life*.8})`; ctx.fill();
            }
            requestAnimationFrame(frame);
        }

        resize(); initStars(); initDust();
        window.addEventListener('resize',()=>{resize();initStars();initDust();});
        requestAnimationFrame(frame);
    })();
    // ═══════════════════════════════════════════════════════════
    restoreInstalledApps();
    renderMoneyHUD();
    setTimeout(() => {
        restoreLastSession();
        const restoredCount = (saveData.openAppIds||[]).length;
        if (restoredCount > 0) showToast(`Restored ${restoredCount} app${restoredCount>1?'s':''} from last session`, 'check');
        else showToast('Welcome to Windows PRO!', 'bell');
    }, 500);
    setTimeout(() => {
        if ((saveData.openAppIds||[]).length > 0) return;
        createWindow('Welcome', {key:'monitor',cls:'ic-blue'}, el => {
            el.innerHTML = `
                <div style="padding:36px 30px;text-align:center;">
                    <div style="width:56px;height:56px;border-radius:14px;display:flex;align-items:center;
                                justify-content:center;margin:0 auto 16px;color:#fff;box-shadow:0 4px 18px rgba(0,120,212,.4);"
                         class="ic-blue">${I.monitor}</div>
                    <h1 style="font-size:22px;font-weight:700;margin-bottom:8px;">Windows PRO</h1>
                    <p style="color:#666;font-size:13px;">My PC, Store and Internet Explorer are ready.</p>
                </div>`;
        }, 500, 340, 200, 100);
    }, 800);
    </script>
</body>
